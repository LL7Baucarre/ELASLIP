<!-- Report Fields -->
<div id="fields-report" class="type-fields">
    <div class="alert alert-info mb-3">
        <i class="fas fa-info-circle me-1"></i>
        Reports are collections of threat intelligence grouped for analysis and distribution.
    </div>
    
    <div class="field-group">
        <label for="published" class="form-label required-field">Published</label>
        <input type="datetime-local" id="published" name="published" class="form-control">
    </div>
    
    <div class="field-group">
        <label for="reportTypes" class="form-label required-field">Report Types</label>
        <select id="reportTypes" name="report_types" class="form-select" multiple>
            <option value="threat-report" selected>Threat Report</option>
            <option value="campaign">Campaign</option>
            <option value="attack-pattern">Attack Pattern</option>
            <option value="malware">Malware</option>
            <option value="threat-actor">Threat Actor</option>
            <option value="tool">Tool</option>
            <option value="vulnerability">Vulnerability</option>
            <option value="vulnerability-assessment">Vulnerability Assessment</option>
            <option value="intrusion-report">Intrusion Report</option>
            <option value="incident-report">Incident Report</option>
        </select>
        <small class="text-muted">Select one or more report types</small>
    </div>
    
    <div class="field-group">
        <label for="reportDescription" class="form-label">Description</label>
        <textarea id="reportDescription" name="description" class="form-control" rows="4"
                  placeholder="Summary of the threat intelligence report"></textarea>
    </div>
    
    <div class="field-group">
        <label for="reportObjectRefs" class="form-label">Object References</label>
        <textarea id="reportObjectRefs" name="x_object_refs_text" class="form-control" rows="3"
                  placeholder="Related STIX objects included in this report (one per line)"></textarea>
        <small class="text-muted">Enter object IDs or identifiers</small>
    </div>
    
    <div class="field-group">
        <label for="reportSource" class="form-label">Report Source</label>
        <input type="text" id="reportSource" name="x_report_source" class="form-control"
               placeholder="Source of the threat intelligence report">
    </div>
</div>
